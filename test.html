        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.alpha = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#3b82f6';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 核心考題處理引擎 ---
        const container = document.getElementById('quiz-container');
        const progressBadge = document.getElementById('progress-badge');
        const scoreBadge = document.getElementById('score-badge');

        function renderQuiz(dataList) {
            container.innerHTML = '';
            progressBadge.innerText = `題庫總計: ${dataList.length} 題`;

            dataList.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'light-card p-6 rounded-2xl transition duration-300';
                card.setAttribute('data-id', q.id);

                let optionsHtml = '';
                for (const [key, val] of Object.entries(q.options)) {
                    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                    const nameAttr = q.type === 'single' ? `name="q-${q.id}"` : '';

                    optionsHtml += `
                        <label class="flex items-start gap-4 p-4 rounded-xl hover:bg-slate-100 cursor-pointer transition border border-slate-100 mt-2">
                            <input type="${inputType}" ${nameAttr} value="${key}" class="large-input accent-blue-600">
                            <span class="text-slate-700 text-base font-medium leading-relaxed">
                                <strong class="text-blue-600 mr-1">${key}.</strong> ${val}
                            </span>
                        </label>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold px-3 py-1 bg-slate-200 text-slate-600 rounded-md border border-slate-300/50">${q.topic}</span>
                        <span class="text-xs font-bold text-indigo-600 font-mono">${q.type === 'single' ? '【單選題】' : '【複選題】'}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">
                        <span class="text-indigo-600 font-black mr-1">Q${index + 1}.</span> ${q.question}
                    </h3>
                    <div class="space-y-1">
                        ${optionsHtml}
                    </div>
                    <div class="result-feedback hidden mt-4 pt-4 border-t border-slate-200 text-sm"></div>
                `;
                container.appendChild(card);
            });
        }

        // 綁定交卷邏輯
        document.getElementById('submit-btn').addEventListener('click', () => {
            let correctCount = 0;
            const targetList = questionsDB.length > 0 ? questionsDB : []; // 防呆

            targetList.forEach(q => {
                const card = container.querySelector(`[data-id="${q.id}"]`);
                if (!card) return;
                const inputs = card.querySelectorAll('input:checked');
                const selectedAnswers = Array.from(inputs).map(i => i.value).sort();
                const correctAnswers = [...q.answer].sort();

                const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(correctAnswers);
                if (isCorrect) correctCount++;

                const feedback = card.querySelector('.result-feedback');
                feedback.classList.remove('hidden');

                if (isCorrect) {
                    card.className = "light-card p-6 rounded-2xl border-l-8 border-green-500 bg-green-50/40 transition duration-300";
                    feedback.innerHTML = `
                        <p class="text-green-600 font-bold flex items-center gap-1">✓ 回答正確</p>
                        <p class="text-slate-500 mt-1">正確答案：<span class="text-slate-800 font-bold">${q.answer.join(', ')}</span> | 社群投票分佈：${q.community_vote}</p>
                    `;
                } else {
                    card.className = "light-card p-6 rounded-2xl border-l-8 border-red-500 bg-red-50/40 transition duration-300";
                    feedback.innerHTML = `
                        <p class="text-red-600 font-bold flex items-center gap-1">✗ 回答錯誤</p>
                        <p class="text-slate-500 mt-1">正確答案：<span class="text-green-600 font-bold">${q.answer.join(', ')}</span> | 您的作答：<span class="text-red-600 font-bold">${selectedAnswers.join(', ') || '未作答'}</span></p>
                        <p class="text-slate-400 mt-0.5">社群備考投票指引：${q.community_vote}</p>
                    `;
                }
            });

            const scorePercent = Math.round((correctCount / targetList.length) * 100);
            scoreBadge.innerText = `最後得分: ${scorePercent}%`;
            scoreBadge.className = scorePercent >= 70 ?
                "px-4 py-2 bg-green-100 text-green-700 rounded-full border border-green-200" :
                "px-4 py-2 bg-red-100 text-red-700 rounded-full border border-red-200";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            renderQuiz(questionsDB);
            scoreBadge.innerText = "得分: 0%";
            scoreBadge.className = "px-4 py-2 bg-blue-100 text-blue-700 rounded-full border border-blue-200";
        });

        // 初始化
        setTimeout(() => {
            // 載入降級防呆
            if (questionsDB.length === 0) {
                // 如果外部未貼入，此處自動提供前幾題做初始化預覽
                questionsDB.push(
                    { "id": "T1_Q1", "topic": "Topic 1: Responsible AI", "type": "single", "question": "Which Microsoft ethical AI principle is aimed at ensuring AI systems treat all people equally?", "options": { "A": "Privacy and Security", "B": "Fairness", "C": "Reliability and Safety", "D": "Inclusiveness" }, "answer": ["B"], "community_vote": "B (100%)" },
                    { "id": "T1_Q2", "topic": "Topic 1: Responsible AI", "type": "single", "question": "What can be done during AI development to minimize bias?", "options": { "A": "Collect massive amounts of data for training.", "B": "Focus on accuracy of the data.", "C": "Use diverse data, fairness metrics, and human oversight.", "D": "Improve on the computational efficiency and speed." }, "answer": ["C"], "community_vote": "C (100%)" }
                );
            }
            renderQuiz(questionsDB);
        }, 100);
    </script>
</body>

</html>
